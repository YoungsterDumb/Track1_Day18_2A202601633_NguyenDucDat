name: student-support-platform

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ews}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ews}
      POSTGRES_DB: ${POSTGRES_DB:-ews}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [ews]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ews} -d ${POSTGRES_DB:-ews}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks: [ews]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  be:
    build:
      context: .
      dockerfile: be/Dockerfile
    image: ews-be:latest
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ews}:${POSTGRES_PASSWORD:-ews}@db:5432/${POSTGRES_DB:-ews}
      REDIS_URL: redis://redis:6379/0
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      SEED_ON_START: ${SEED_ON_START:-true}
    ports:
      - "${BE_PORT:-8000}:8000"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [ews]

  worker:
    build:
      context: .
      dockerfile: be/Dockerfile
    image: ews-be:latest
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ews}:${POSTGRES_PASSWORD:-ews}@db:5432/${POSTGRES_DB:-ews}
      REDIS_URL: redis://redis:6379/0
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
      SEED_ON_START: "false"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      be: {condition: service_healthy}
    networks: [ews]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s

  fe:
    build:
      context: .
      dockerfile: fe/Dockerfile
    image: ews-fe:latest
    ports:
      - "${FE_PORT:-8080}:8080"
    depends_on:
      be: {condition: service_healthy}
    networks: [ews]

  # Not part of `docker compose up` — opt in with: docker compose --profile test run --rm tests
  tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    image: ews-tests:latest
    profiles: [test]
    environment:
      AUTH_SECRET: test-secret
      SEED_ON_START: "false"
    networks: [ews]

volumes:
  pgdata:
  redisdata:

networks:
  ews:
    driver: bridge
