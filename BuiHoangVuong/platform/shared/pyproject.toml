[project]
name = "ews-shared"
version = "1.0.0"
description = "Shared risk-scoring rules and explanations reused from the BuiHoangVuong prototype"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ews_shared*"]
