services:
  app:
    build: .
    image: student-early-warning:latest
    container_name: student-early-warning
    ports:
      - "8501:8501"
    volumes:
      - sqlite-data:/data
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4).status == 200 else 1)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  sqlite-data:
